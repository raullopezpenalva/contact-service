name: CI - Build and Push to GHCR

on:
  release:
    types: [released]
  
permissions:
  contents: read


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: raullopezpenalva/contact-service

jobs:
  test:
    uses: ./.github/workflows/verify.yml
    with:
      export_image: true
    permissions:
      contents: read

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
    
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Extract tag from ref
        id: extract_tag
        run: echo "TAG=${GITHUB_REF##*/}" >> "$GITHUB_ENV"

      - name: Download smoke-tested runtime image
        uses: actions/download-artifact@v4
        with:
          name: verified-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image

      - name: Tag verified image for publication
        run: |
          gzip --decompress --stdout verified-image/runtime-image.tar.gz | docker load
          docker tag contact-service:ci-smoke "$REGISTRY/$IMAGE_NAME:$TAG"
          docker tag contact-service:ci-smoke "$REGISTRY/$IMAGE_NAME:latest"

      - name: Push Docker Images to GHCR
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:$TAG"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
