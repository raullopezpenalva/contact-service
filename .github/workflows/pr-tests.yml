name: Pull request tests
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      verify_release_artifact:
        description: Verify image artifact handoff without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/verify.yml
    with:
      export_image: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_release_artifact }}
  image-transfer:
    name: Verified image transfer check
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release_artifact
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the producer's artifact identity
        env:
          IMAGE_ARTIFACT_ID: ${{ needs.tests.outputs.image_artifact_id }}
        run: |
          if [[ ! "$IMAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "Missing verified image artifact ID" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.tests.outputs.image_artifact_id }}
          merge-multiple: true
          path: verified-image
      - name: Load the verified image without publishing
        run: |
          gzip --decompress --stdout verified-image/runtime-image.tar.gz | docker load
          test "$(docker image inspect contact-service:ci-smoke --format '{{.Config.User}}')" = '10001:10001'
