name: Verify
on:
  workflow_call:
    inputs:
      export_image:
        description: Export the smoke-tested image for release publication
        type: boolean
        default: false
    outputs:
      image_artifact_id:
        description: Immutable artifact ID of the successfully smoke-tested image
        value: ${{ jobs.container-smoke.outputs.image_artifact_id }}
permissions:
  contents: read
jobs:
  verify:
    name: Java 21 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run all tests
        run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
  container-smoke:
    name: Runtime image smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_artifact_id: ${{ steps.upload_image.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image after Maven verification
        run: docker build --build-arg SKIP_TESTS=true -t contact-service:ci-smoke .
      - name: Verify runtime against isolated PostgreSQL
        run: bash scripts/verify-container.sh contact-service:ci-smoke
      - name: Verify controlled admin operator
        run: bash scripts/verify-admin-operator.sh contact-service:ci-smoke
      - name: Export verified runtime image
        if: inputs.export_image
        run: docker save contact-service:ci-smoke | gzip > runtime-image.tar.gz
      - name: Retain verified image for release publication
        id: upload_image
        if: inputs.export_image
        uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-image.tar.gz
          retention-days: 1
          compression-level: 0
