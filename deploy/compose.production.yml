# Run from the repository root: docker compose -f deploy/compose.production.yml config
services:
  proxy:
    image: nginx:stable-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE}:/etc/nginx/tls/privkey.pem:ro
    networks:
      edge:
      backend:
        ipv4_address: 172.30.27.2
    depends_on:
      - contact-service
  contact-service:
    image: ${CONTACT_SERVICE_IMAGE:?Set a tested image tag or digest}
    env_file:
      - ${CONTACT_SERVICE_ENV_FILE:?Set path to production environment file}
    environment:
      SPRING_SERVER_PORT: "8080"
      SECURITY_TRUSTED_PROXIES: "172.30.27.2"
    # Deliberately no published backend ports.
    networks:
      - backend
      - outbound
    restart: unless-stopped
networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.27.0/24
  # Outbound access for SMTP/Telegram; no published ingress.
  outbound:
