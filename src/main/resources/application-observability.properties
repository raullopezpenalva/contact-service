# Opt-in private management listener; never publish it through the public proxy.
management.server.port=${CONTACT_MANAGEMENT_PORT:19090}
management.server.address=${CONTACT_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
spring.datasource.hikari.pool-name=contact
# Technical correlation only; no arbitrary MDC entries or request data.
logging.pattern.level=%5p requestId=%X{requestId}
