# --- Application Properties ---
spring.application.name=${SPRING_APPLICATION_NAME:contact-service}
server.port=${SPRING_SERVER_PORT}

# --- PostgreSQL Database Configuration ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# Database error details can contain entire rows, including encoded credentials.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Security Configuration ---

# --- Notification Service Configuration ---
app.notification.enabled=${NOTIFICATION_ENABLED:true}
app.notifications.channels=${NOTIFICATIONS_CHANNELS:EMAIL}

telegram.bot.token=${TELEGRAM_BOT_TOKEN:dummy}
telegram.chat.id=${TELEGRAM_CHAT_ID:0}
telegram.api.base-url=${TELEGRAM_API_BASE_URL:dummy}

email.recipient=${EMAIL_RECIPIENT:dummy}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# --- WebSecurity Configuration ---
app.security.rate-limit.contactrequest.max-requests=${SECURITY_RATE_LIMIT_CONTACTREQUEST_MAX_REQUESTS:5}
app.security.rate-limit.contactrequest.window-seconds=${SECURITY_RATE_LIMIT_CONTACTREQUEST_WINDOW_SECONDS:3600}
# Keep original peer address: only the application filter trusts configured proxies.
server.forward-headers-strategy=NONE
app.security.trusted-proxies=${SECURITY_TRUSTED_PROXIES:}
app.security.max-request-bytes=${SECURITY_MAX_REQUEST_BYTES:16384}
app.security.rate-limit.admin.max-requests=${SECURITY_RATE_LIMIT_ADMIN_MAX_REQUESTS:60}
app.security.rate-limit.admin.window-seconds=${SECURITY_RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}

# Retry FAILED versioned notification snapshots (single active application instance).
app.notifications.retry.enabled=${NOTIFICATIONS_RETRY_ENABLED:true}
app.notifications.retry.max-attempts=${NOTIFICATIONS_RETRY_MAX_ATTEMPTS:3}
app.notifications.retry.interval=${NOTIFICATIONS_RETRY_INTERVAL:30s}
app.notifications.retry.batch-size=${NOTIFICATIONS_RETRY_BATCH_SIZE:100}

# Explicit production surface: local documentation must be enabled in a local/test profile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
app.security.local-docs-enabled=${SECURITY_LOCAL_DOCS_ENABLED:false}

# Protected local signing files; no default key or shared account.
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.active-key-id=${JWT_ACTIVE_KEY_ID}
app.security.jwt.private-key-file=${JWT_PRIVATE_KEY_FILE}
app.security.jwt.public-key-directory=${JWT_PUBLIC_KEY_DIRECTORY}
app.security.rate-limit.login.max-requests=${SECURITY_RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
app.security.rate-limit.password.max-requests=${SECURITY_RATE_LIMIT_PASSWORD_MAX_REQUESTS:5}
app.security.rate-limit.auth.max-requests=${SECURITY_RATE_LIMIT_AUTH_MAX_REQUESTS:60}

spring.jpa.open-in-view=false
